<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Offline-first scouting, stats and tools for VEX V5RC and VEX U." />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>VEX Scout</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var s = JSON.parse(localStorage.getItem('vex-scout-settings') || '{}').state || {};
        var t = s.theme || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.accent = s.accent || 'blue';
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>VEX Scout needs JavaScript enabled.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
